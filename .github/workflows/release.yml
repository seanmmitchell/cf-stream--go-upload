name: Release

on:
  push:
    tags:
      - "v[0-9]*"
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag and publish from the default branch, e.g. v0.0.1. Leave empty to only build."
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - id: resolve
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          publish=false
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="$GITHUB_REF_NAME"
            publish=true
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_VERSION" ]]; then
            semver='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
            if [[ ! "$INPUT_VERSION" =~ $semver ]]; then
              echo "::error::version must look like v1.2.3 or v1.2.3-rc1"
              exit 1
            fi
            if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
              echo "::error::releases can only be dispatched from $DEFAULT_BRANCH"
              exit 1
            fi
            version="$INPUT_VERSION"
            publish=true
          else
            version="${HEAD_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: meta
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Build with the latest patched Go release so shipped binaries carry
      # current stdlib security fixes; go.mod's go line is only the minimum.
      # No cache: the matrix legs would share one key, and release builds
      # should not depend on cache contents.
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: Build and package
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          bin="cfsgo"
          [[ "$GOOS" == "windows" ]] && bin="cfsgo.exe"
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage" dist
          go build -trimpath -ldflags="-s -w" -o "$stage/$bin" .
          cp README.md "$stage/"
          archive="cfsgo_${VERSION}_${GOOS}_${GOARCH}"
          if [[ "$GOOS" == "windows" ]]; then
            (cd "$stage" && zip -q "$GITHUB_WORKSPACE/dist/$archive.zip" "$bin" README.md)
          else
            tar -czf "dist/$archive.tar.gz" -C "$stage" "$bin" README.md
          fi
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: cfsgo-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: [meta, build]
    # Tag pushes, or a manual run on the default branch with a version.
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.meta.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cfsgo-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS.txt

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          tag="$VERSION"
          flags=()
          # Tags like v1.2.0-rc1 are published as pre-releases; "+build"
          # metadata is ignored when checking for the "-".
          [[ "${tag%%+*}" == *-* ]] && flags+=(--prerelease)

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            # Create the tag at the commit that was just built. Never reuse an
            # existing tag: its release would get binaries from another commit.
            existing=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" \
              --jq "map(select(.ref == \"refs/tags/$tag\")) | length")
            if [[ "$existing" != "0" ]]; then
              echo "::error::tag $tag already exists; choose a new version"
              exit 1
            fi
            gh release create "$tag" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$tag" \
              --generate-notes \
              --target "$GITHUB_SHA" \
              "${flags[@]}"
            exit 0
          fi

          # Tag push: re-runs, or a release already drafted in the UI, get
          # their assets replaced instead of failing.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$tag" \
            --generate-notes \
            --verify-tag \
            "${flags[@]}"
