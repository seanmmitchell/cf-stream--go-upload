name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Build with the latest patched Go release so shipped binaries carry
      # current stdlib security fixes; go.mod's go line is only the minimum.
      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="${GITHUB_SHA::7}"
          fi
          bin="cfsgo"
          [[ "$GOOS" == "windows" ]] && bin="cfsgo.exe"
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage" dist
          go build -trimpath -ldflags="-s -w" -o "$stage/$bin" .
          cp README.md "$stage/"
          archive="cfsgo_${version}_${GOOS}_${GOARCH}"
          if [[ "$GOOS" == "windows" ]]; then
            (cd "$stage" && zip -q "$GITHUB_WORKSPACE/dist/$archive.zip" "$bin" README.md)
          else
            tar -czf "dist/$archive.tar.gz" -C "$stage" "$bin" README.md
          fi
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: cfsgo-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cfsgo-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=()
          # Tags like v1.2.0-rc1 are published as pre-releases.
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            "${flags[@]}"
