name: Release

on:
  push:
    tags:
      - "v[0-9]*"
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag and publish from the default branch, e.g. v0.0.1. Leave empty to only build."
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          shopt -s inherit_errexit
          publish=false
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="$GITHUB_REF_NAME"
            publish=true
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_VERSION" ]]; then
            # vMAJOR.MINOR.PATCH with an optional -prerelease; no +build metadata.
            semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
            if [[ ! "$INPUT_VERSION" =~ $semver ]] || ! git check-ref-format "refs/tags/$INPUT_VERSION"; then
              echo "::error::version must look like v1.2.3 or v1.2.3-rc.1"
              exit 1
            fi
            if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
              echo "::error::releases can only be dispatched from $DEFAULT_BRANCH"
              exit 1
            fi
            # Fail before building if the version is tagged on another commit.
            existing=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$INPUT_VERSION" \
              --jq "map(select(.ref == \"refs/tags/$INPUT_VERSION\"))[0].object // empty | \"\(.type) \(.sha)\"")
            if [[ "$existing" == "tag "* ]]; then
              existing="commit $(gh api "repos/$GITHUB_REPOSITORY/git/tags/${existing#tag }" --jq .object.sha)"
            fi
            if [[ -n "$existing" && "${existing#* }" != "$GITHUB_SHA" ]]; then
              echo "::error::tag $INPUT_VERSION already exists on another commit; choose a new version"
              exit 1
            fi
            version="$INPUT_VERSION"
            publish=true
          else
            version="${HEAD_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: meta
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Build with the latest patched Go release so shipped binaries carry
      # current stdlib security fixes; go.mod's go line is only the minimum.
      # No cache: the matrix legs would share one key, and release builds
      # should not depend on cache contents.
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: Build and package
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          bin="cfsgo"
          [[ "$GOOS" == "windows" ]] && bin="cfsgo.exe"
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage" dist
          go build -trimpath -ldflags="-s -w" -o "$stage/$bin" .
          cp README.md "$stage/"
          archive="cfsgo_${VERSION}_${GOOS}_${GOARCH}"
          if [[ "$GOOS" == "windows" ]]; then
            (cd "$stage" && zip -q "$GITHUB_WORKSPACE/dist/$archive.zip" "$bin" README.md)
          else
            tar -czf "dist/$archive.tar.gz" -C "$stage" "$bin" README.md
          fi
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: cfsgo-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: [meta, build]
    # Tag pushes, or a manual run on the default branch with a version.
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.meta.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cfsgo-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS.txt

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s inherit_errexit
          tag="$VERSION"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            # Create the tag first, in one atomic step, at the commit that was
            # built. A tag that already exists must point at that same commit
            # (a re-run): a release must never get another commit's binaries.
            if ! gh api "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null; then
              existing=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" \
                --jq "map(select(.ref == \"refs/tags/$tag\"))[0].object // empty | \"\(.type) \(.sha)\"")
              if [[ "$existing" == "tag "* ]]; then
                existing="commit $(gh api "repos/$GITHUB_REPOSITORY/git/tags/${existing#tag }" --jq .object.sha)"
              fi
              if [[ "${existing#* }" != "$GITHUB_SHA" ]]; then
                echo "::error::could not create tag $tag at $GITHUB_SHA. If the API refused it (403/404), main has since changed workflow files: run the workflow again from the current main."
                exit 1
              fi
            fi
          fi

          # A release may already exist for the tag: a re-run, or a draft
          # written in the UI. Its assets are replaced and a draft is
          # published. (With immutable releases enabled, a published release
          # can't take new assets, so re-running a published one fails.)
          if is_draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            if [[ "$is_draft" == "true" ]]; then
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
            fi
            exit 0
          fi

          flags=()
          # Tags like v1.2.0-rc1 are published as pre-releases; "+build"
          # metadata (possible on pushed tags) is ignored when checking.
          [[ "${tag%%+*}" == *-* ]] && flags+=(--prerelease)
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$tag" \
            --generate-notes \
            --verify-tag \
            "${flags[@]}"
